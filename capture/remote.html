<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monet TV">
<title>Monet TV</title>
<style>
  :root {
    --bg: #06060a; --card: #12121a; --edge: rgba(255,255,255,.08);
    --ink: #f4f3f8; --ink-2: rgba(244,243,248,.62); --ink-3: rgba(244,243,248,.4);
    --on: #2ee6d6; --violet: #7c5cff; --warn: #ffb547; --bad: #ff5c93;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 18px calc(env(safe-area-inset-bottom, 0px) + 28px);
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 30rem; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
  h1 span { color: var(--violet); }
  .row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--edge); border-radius: 20px;
    padding: 18px 18px; color: inherit; font: inherit; cursor: pointer;
  }
  .row:disabled { cursor: progress; }
  .row b { display: block; font-size: 19px; font-weight: 600; }
  .row small { display: block; color: var(--ink-3); font-size: 14px; }
  .txt { flex: 1; min-width: 0; }
  .sw {
    flex: none; width: 58px; height: 34px; border-radius: 99px; background: #2a2a36;
    position: relative; transition: background .2s;
  }
  .sw::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px;
    border-radius: 50%; background: #fff; transition: transform .2s;
  }
  .row[aria-checked="true"] .sw { background: var(--on); }
  .row[aria-checked="true"] .sw::after { transform: translateX(24px); }
  .row.busy .sw { opacity: .45; }
  .status { color: var(--ink-2); font-size: 14px; padding: 4px 4px 0; min-height: 1.4em; }
  .status.bad { color: var(--bad); }
  .note { color: var(--ink-3); font-size: 13px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <h1>Monet <span>TV</span></h1>
  <button class="row" role="switch" aria-checked="false" data-sw="subtitles">
    <span class="txt"><b>Subtitles</b><small data-sub>Spanish + English key words</small></span><span class="sw"></span>
  </button>
  <button class="row" role="switch" aria-checked="false" data-sw="preview">
    <span class="txt"><b>Pi preview</b><small data-sub>Full screen on the Pi</small></span><span class="sw"></span>
  </button>
  <p class="status" id="status">Connecting…</p>
  <p class="note">Subtitles put the Pi preview 18 s behind live so they line up with the speech.
    On the TV, turn on CC in the Monet TV app.</p>
</main>
<script>
// The token comes once in the link (?t=...), then lives in this phone's storage.
const q = new URLSearchParams(location.search);
let token = q.get("t") || "";
try {
  if (token) { localStorage.setItem("monet-token", token); history.replaceState(null, "", location.pathname); }
  else token = localStorage.getItem("monet-token") || "";
} catch { /* private mode: keep the token in memory */ }

const statusEl = document.getElementById("status");
const rows = [...document.querySelectorAll("[data-sw]")];
let busy = false;

function say(text, bad = false) { statusEl.textContent = text; statusEl.classList.toggle("bad", bad); }

async function api(path, method = "GET") {
  const r = await fetch(path, { method, headers: { "X-Token": token } });
  if (r.status === 401) throw new Error("This link has no valid token. Open the full link from the Pi once.");
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

function show(s) {
  for (const row of rows) row.setAttribute("aria-checked", String(!!s[row.dataset.sw]));
  const sub = (k) => rows.find((r) => r.dataset.sw === k).querySelector("[data-sub]");
  sub("subtitles").textContent = s.subtitles
    ? (s.captions ? "On · Whisper running" : "On · starting…") : "Off";
  sub("preview").textContent = !s.preview ? "Off · dashboard shows"
    : !s.preview_active ? "On · paused while a TV is watching"
    : s.delay ? `On · ${s.delay} s behind live` : "On · live";
  const stream = !s.cast ? "TV stream off (starts when someone watches)"
    : s.viewers ? `TV stream on · ${s.viewers} watching` : "TV stream on · stops after 5 min unwatched";
  say(s.hub ? `Capture running · ${stream}` : "Capture hub is not running", !s.hub);
}

async function refresh() {
  if (busy) return;
  try { show(await api("/tv")); } catch (e) { say(e.message, true); }
}

for (const row of rows) {
  row.addEventListener("click", async () => {
    if (busy) return;
    const on = row.getAttribute("aria-checked") !== "true";
    busy = true;
    row.classList.add("busy"); rows.forEach((r) => (r.disabled = true));
    row.setAttribute("aria-checked", String(on));
    say("Switching…");
    try { show(await api(`/tv/${row.dataset.sw}/${on ? "on" : "off"}`, "POST")); }
    catch (e) { say(e.message, true); }
    finally { busy = false; row.classList.remove("busy"); rows.forEach((r) => (r.disabled = false)); }
  });
}

if (!token) say("Open the full link (with ?t=…) from the Pi once.", true);
refresh();
setInterval(refresh, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
