# Keys in the capture hub's preview window. They go through capture/tvctl.py so the
# phone page and the dashboard card show the same state. systemd-run moves the command
# out of the hub's cgroup: restarting monet-hub would otherwise kill it with mpv.
# (Exit code 42 = "user quit" is still understood by capture-hub.sh when run by hand.)
q   run systemd-run --user --collect --quiet /bin/sh -c "python3 ~/dashboard/capture/tvctl.py set preview off"
Q   run systemd-run --user --collect --quiet /bin/sh -c "python3 ~/dashboard/capture/tvctl.py set preview off"
ESC run systemd-run --user --collect --quiet /bin/sh -c "python3 ~/dashboard/capture/tvctl.py set preview off"
c   run systemd-run --user --collect --quiet /bin/sh -c "python3 ~/dashboard/capture/tvctl.py toggle subtitles"
